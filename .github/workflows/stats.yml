name: Update stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # daily (08:00 Taiwan time)
  workflow_dispatch:       # lets you run it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=WilliamPanTW&show_icons=true&hide_border=true&include_all_commits=true&bg_color=2d333b&title_color=ffffff&text_color=c9d1d9&icon_color=58a6ff
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=WilliamPanTW&layout=compact&hide_border=true&langs_count=8&hide=jupyter%20notebook,html,css&size_weight=0.5&count_weight=0.5&bg_color=2d333b&title_color=ffffff&text_color=c9d1d9
          path: assets/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || (git commit -m "Update stats cards" && git push)
